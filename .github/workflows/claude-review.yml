name: Claude 코드 리뷰

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "Source/**"
      - "Config/**"
      - "Data/**"
      - "Tools/**"
      - "*.uproject"
      - "CLAUDE.md"
      - ".github/**"

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      # LFS 에셋은 받지 않는다 (리뷰 대상은 코드·설정·CSV)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 리뷰하고 결과를 한국어로 남겨 주세요. 저장소 루트의 CLAUDE.md 규칙이 기준입니다.
            UE 엔진이 없는 환경이라 빌드는 할 수 없으니 코드를 읽고 판단해 주세요.

            중점적으로 볼 것:
            - CLAUDE.md의 폴더 규칙·GAS 구조 원칙 위반 (예: 어빌리티에서 이펙트 직접 스폰, HP 직접 수정)
            - UE C++ 실수: UPROPERTY 누락으로 인한 GC 문제, 널 체크, 프레임에 따라 달라지는 로직
            - 시간 배속 영향을 받는 타이머 (히트스톱 해제는 실제 시간 기준이어야 함)
            - 코드에 박힌 타격감 수치 (CSV DataTable이나 DataAsset으로 빼야 할 값)
            - Data/*.csv 변경이 PR 설명의 의도와 맞는지

            구체적인 문제는 해당 줄에 인라인 코멘트로 남기고, 전체 요약은 `gh pr comment`로 하나만 남겨 주세요.
            고칠 이유가 분명한 것만 남기고, 사소한 스타일 지적과 칭찬은 줄여 주세요.

          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
